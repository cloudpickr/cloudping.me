name: Reachability monitors

# Two complementary, credential-free reachability watchers that read only the
# public status-branch latest.json/history.json (no cloud calls -> zero added
# cost; public-repo Actions minutes are free) and keep tiny rolling state on a
# DEDICATED `cn-monitor` branch (so the probe's force-push to `status` can't
# clobber it). Each opens/refreshes ONE tracking issue when its condition fires;
# healthy windows are silent. Neither edits data or config.
#
# 1. China reachability (scripts/check-cn-reachability.mjs): the GFW-specific
#    mainland-vs-Hong-Kong blackhole. Reopen triggers T1 (rate) / T2 (stuck).
#    The deeper T3/T4 need non-public CloudWatch data and stay a human-log task.
# 2. Fleet reachability (scripts/check-fleet-reachability.mjs): a whole ORIGIN
#    FLEET (all AWS / all GCP / all Azure) failing ONE target while the other two
#    fleets reach it fine (cross-fleet asymmetry). Baseline-gated (chronically-
#    dead targets never qualify) and CONFIRMED over 2 consecutive rounds before
#    it alerts, so self-healing single-round blips (e.g. Azure→Vultr Santiago)
#    are recorded but stay quiet.

on:
  # Primary trigger: run right after each Probe round completes. GitHub often
  # delays or DROPS scheduled cron on public repos under load (observed: the old
  # :12,:42 cron fired only ~once every few hours), which would make the monitor
  # miss the consecutive-round windows its triggers depend on. The Probe workflow
  # runs reliably every 30 min, so chaining off its completion guarantees the
  # monitor runs whenever fresh data is published. workflow_run fires even if that
  # Probe run SKIPPED publishing (it still completes) — the monitor reads the
  # public latest.json regardless, so a skipped round is harmless.
  workflow_run:
    workflows: ['Probe']
    types: [completed]
  # Backup reconciliation only, in case a workflow_run event is missed: a sparse
  # hourly cron (not :12,:42) so we don't rely solely on GitHub's flaky scheduler.
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: cn-reachability
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fetch the dedicated state branch (create empty on first run). This branch
      # is touched ONLY by this workflow, so it never races the probe's
      # force-push to `status`. Both monitors' state files live here.
      - name: Load monitor state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin cn-monitor >/dev/null 2>&1; then
            git fetch origin cn-monitor
            git show origin/cn-monitor:cn-monitor.json > cn-monitor.json 2>/dev/null || echo '{"entries":[]}' > cn-monitor.json
            git show origin/cn-monitor:fleet-monitor.json > fleet-monitor.json 2>/dev/null || echo '{"version":1,"lastSlot":null,"events":{}}' > fleet-monitor.json
          else
            echo '{"entries":[]}' > cn-monitor.json
            echo '{"version":1,"lastSlot":null,"events":{}}' > fleet-monitor.json
          fi

      - name: Run China reachability monitor
        id: monitor
        run: |
          set -euo pipefail
          node scripts/check-cn-reachability.mjs || true                       # human-readable to the run log
          node scripts/check-cn-reachability.mjs --persist --json > /tmp/cn-monitor-result.json
          has=$(python3 -c 'import json; print(str(json.load(open("/tmp/cn-monitor-result.json"))["hasProblem"]).lower())')
          echo "has_problem=${has}" >> "${GITHUB_OUTPUT}"

      - name: Run fleet reachability monitor
        id: fleet
        run: |
          set -euo pipefail
          node scripts/check-fleet-reachability.mjs || true                    # human-readable to the run log
          node scripts/check-fleet-reachability.mjs --persist --json > /tmp/fleet-monitor-result.json
          has=$(python3 -c 'import json; print(str(json.load(open("/tmp/fleet-monitor-result.json"))["hasProblem"]).lower())')
          echo "has_problem=${has}" >> "${GITHUB_OUTPUT}"

      # Persist BOTH state files back to the dedicated branch in one push.
      - name: Save monitor state
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp cn-monitor.json "${tmp}/cn-monitor.json" || { echo "failed to back up cn state" >&2; exit 1; }
          cp fleet-monitor.json "${tmp}/fleet-monitor.json" || { echo "failed to back up fleet state" >&2; exit 1; }
          git checkout --orphan cn-monitor-publish
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* >/dev/null 2>&1 || true
          cp "${tmp}/cn-monitor.json" cn-monitor.json || { echo "failed to restore cn state" >&2; exit 1; }
          cp "${tmp}/fleet-monitor.json" fleet-monitor.json || { echo "failed to restore fleet state" >&2; exit 1; }
          # Vercel reads git.deploymentEnabled from the vercel.json on the PUSHED
          # branch. This orphan branch has no source, so without this file Vercel
          # defaults to enabled and fails a preview build on every 30-min push.
          # Ship a disabling vercel.json here (same trick the status publisher in
          # probe.yml uses) so Vercel never creates a deployment for this branch.
          printf '%s' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add cn-monitor.json fleet-monitor.json vercel.json
          git commit -m "monitors $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push --force origin HEAD:cn-monitor

      - name: Open or refresh tracking issue
        if: steps.monitor.outputs.has_problem == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json
          d = json.load(open("/tmp/cn-monitor-result.json"))
          L = ["A China-reachability reopen trigger fired. Background: cloudping's China-mainland",
               "cells intermittently go all-blank from an AWS origin for a single 30-min round",
               "while the Hong Kong controls stay healthy. A three-model review (claude + antigravity",
               "+ codex) localized this to TCP connection establishment on the origin→mainland path",
               "(DNS resolves; a raw SYN to a mainland IP literal times out), with the responsible",
               "network SUSPECTED (GFW / transit / source-prefix filtering) but NOT proven, and",
               "decided to STOP touching probing code and accept self-healing single-round blanks.",
               "",
               "This issue means one of the agreed **reopen triggers** has now fired — reassess",
               "whether a real fix (e.g. a static clean egress IP via VPC+NAT, ~$36/mo/region) is",
               "now worth it, or whether the window is still acceptable.", "",
               f"_Generated {d['generatedAt']} (round {d.get('roundAt')}) by `.github/workflows/cn-reachability.yml`._",
               f"_Window: {d['windowHours']}h, {d['observations']} origin-round observations, {d['blackholes']} blackhole ({int(d['rate']*100)}%)._",
               ""]
          if d.get("freqFlagged"):
              L.append(f"### Trigger T1 — blackhole RATE elevated")
              L.append(f"- {int(d['rate']*100)}% of observations were mainland-blackhole over {d['windowHours']}h "
                       f"(alert threshold {int(d['freqThreshold']*100)}%).")
              L.append("")
          if d.get("stuck"):
              L.append(f"### Trigger T2 — an origin STOPPED self-healing")
              for s in d["stuck"]:
                  L.append(f"- `{s['origin']}`: mainland all-failed (HK healthy) for {s['streak']} consecutive rounds "
                           f"(threshold {d['stuckThreshold']}); latest {s['lastAt']}.")
              L.append("")
          L.append("### Per-origin over the window")
          for o in d["perOrigin"]:
              if o["blackholes"]:
                  L.append(f"- `{o['origin']}`: {o['blackholes']}/{o['observations']} blackhole ({int(o['rate']*100)}%)")
          L += ["",
                "### Not auto-checked (need CloudWatch, do by hand if diagnosing)",
                "- T3: a `probe-round-summary` where `blackholeStage.dnsOk` and a raw SYN both succeed yet the round still failed (would mean the cause is NOT a network blackhole).",
                "- T4: the same `egressIp` seen in both a blackhole and a healthy round (would test the per-IP-block hypothesis).",
                "",
                "Diagnose — do not auto-fix. Close this issue once reassessed; it re-opens if the trigger persists."]
          print("\n".join(L))
          PY
          )"

          title="China reachability: a reopen trigger fired"
          existing="$(gh issue list --state open --search "in:title ${title}" --json number,title \
            --jq ".[] | select(.title==\"${title}\") | .number" | head -n1)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Refreshed existing issue #${existing}."
          else
            gh issue create --title "${title}" --body "${body}" --label cn-reachability 2>/dev/null \
              || gh issue create --title "${title}" --body "${body}"
          fi

      - name: Open or refresh fleet-reachability issue
        if: steps.fleet.outputs.has_problem == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json
          d = json.load(open("/tmp/fleet-monitor-result.json"))
          L = ["A **fleet-wide reachability asymmetry** has been CONFIRMED across two consecutive",
               "probe rounds: an entire origin fleet (all AWS, or all GCP, or all Azure regions)",
               "cannot reach a target that BOTH other fleets reach fine in the same round. Because",
               "the same target succeeds from the other two fleets, the target itself is up — the",
               "failure is specific to the suspect fleet's egress/path to that target.", "",
               "Only baseline-healthy targets qualify (chronically-dead / probe_disabled targets are",
               "gated out via the ~24h success history), and a candidate must persist for two",
               "consecutive rounds before this issue opens — so self-healing single-round blips",
               "(e.g. a one-round Azure→Vultr-Santiago blank) do NOT alert.", "",
               f"_Generated {d['generatedAt']} (round {d.get('roundAt')}) by `.github/workflows/cn-reachability.yml`._",
               ""]
          conf = d.get("activeConfirmed") or []
          if conf:
              L.append("### Confirmed fleet-wide asymmetries")
              for e in conf:
                  others = ", ".join(f"{g} {s['ok']}/{s['n']}" for g, s in (e.get("others") or {}).items())
                  L.append(f"- **{e['key']}** since {e.get('since')}: "
                           f"{e.get('failed')}/{e.get('observed')} of the fleet's origins fail it; "
                           f"other fleets OK ({others}).")
              L.append("")
          cands = d.get("candidatesThisRound") or []
          if cands:
              L.append("### Candidates in the current round")
              for c in cands:
                  others = ", ".join(f"{g} {s['ok']}/{s['n']}" for g, s in (c.get("others") or {}).items())
                  L.append(f"- `{c['fleet']}` fleet → `{c['provider']}:{c['region']}` "
                           f"({c['failed']}/{c['observed']} fail); others OK ({others}).")
              L.append("")
          L += ["Diagnose — do not auto-fix. The cause is suspected (fleet egress/path, provider",
                "routing, or target-side filtering of that fleet's addresses), not proven. Close",
                "this issue once reassessed; it re-opens if the asymmetry persists."]
          print("\n".join(L))
          PY
          )"

          title="Fleet reachability: a confirmed cross-fleet asymmetry"
          existing="$(gh issue list --state open --search "in:title ${title}" --json number,title \
            --jq ".[] | select(.title==\"${title}\") | .number" | head -n1)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Refreshed existing issue #${existing}."
          else
            gh issue create --title "${title}" --body "${body}" --label fleet-reachability 2>/dev/null \
              || gh issue create --title "${title}" --body "${body}"
          fi
