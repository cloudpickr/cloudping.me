name: CI

# Runs the same checks we do locally before opening a PR: lint, type-check,
# and a production build. This makes PRs a real gate -- a red check here means
# the change should not merge to main.
#
# Public repo -> GitHub Actions minutes are free regardless of run time.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only builds/lints, so it needs read-only
# access to the checkout and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
